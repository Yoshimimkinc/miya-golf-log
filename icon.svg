<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1f9d57"/>
      <stop offset="0.55" stop-color="#16843f"/>
      <stop offset="1" stop-color="#0c5d2a"/>
    </linearGradient>
    <radialGradient id="green" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#7fd07f"/>
      <stop offset="0.7" stop-color="#3fae53"/>
      <stop offset="1" stop-color="#2b8c40"/>
    </radialGradient>
    <radialGradient id="ball" cx="36%" cy="30%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.78" stop-color="#eef4ee"/>
      <stop offset="1" stop-color="#c9d6c9"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#063515" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>

  <!-- putting green mound -->
  <ellipse cx="256" cy="360" rx="186" ry="92" fill="url(#green)"/>
  <ellipse cx="256" cy="360" rx="186" ry="92" fill="none" stroke="#bdf0b6" stroke-width="5" opacity="0.4"/>

  <!-- flag pole -->
  <rect x="300" y="118" width="13" height="232" rx="6" fill="#f4f7f4"/>
  <rect x="300" y="118" width="13" height="232" rx="6" fill="#000" opacity="0.08"/>

  <!-- flag -->
  <path d="M300 126 L398 156 L300 196 Z" fill="#e23b3b" filter="url(#sh)"/>
  <path d="M300 126 L398 156 L300 196 Z" fill="none" stroke="#b62b2b" stroke-width="3" opacity="0.5"/>

  <!-- cup / hole -->
  <ellipse cx="306" cy="350" rx="34" ry="13" fill="#0a3d1a"/>
  <ellipse cx="306" cy="348" rx="34" ry="13" fill="#06310f"/>

  <!-- golf ball -->
  <circle cx="176" cy="338" r="60" fill="url(#ball)" filter="url(#sh)"/>
  <g opacity="0.20" fill="#8a9c8a">
    <circle cx="156" cy="320" r="6"/><circle cx="178" cy="313" r="6"/><circle cx="200" cy="322" r="6"/>
    <circle cx="150" cy="342" r="6"/><circle cx="174" cy="336" r="6"/><circle cx="198" cy="344" r="6"/>
    <circle cx="164" cy="362" r="6"/><circle cx="188" cy="364" r="6"/>
  </g>
</svg>
